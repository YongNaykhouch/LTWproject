<h5 class="text-primary mb-4">
  <i class="fas fa-wind me-2"></i>Thông Số Kỹ Thuật - Điều Hòa
</h5>
<div class="row g-3">
  <div class="col-md-6">
    <label>Công suất làm lạnh</label
    ><input
      type="text"
      name="capacity"
      class="form-control"
      placeholder="VD: 12000 BTU"
    />
  </div>
  <div class="col-md-6">
    <label>Loại máy</label
    ><input
      type="text"
      name="type"
      class="form-control"
      placeholder="VD: Inverter 2 chiều"
    />
  </div>
  <div class="col-md-6">
    <label>Công nghệ làm lạnh</label
    ><input
      type="text"
      name="cooling_tech"
      class="form-control"
      placeholder="VD: Nanoe-X"
    />
  </div>
  <div class="col-md-6">
    <label>Tiết kiệm năng lượng</label
    ><input
      type="text"
      name="energy_rating"
      class="form-control"
      placeholder="VD: Inverter / 5 sao"
    />
  </div>
  <div class="col-md-6">
    <label>Công suất tiêu thụ</label
    ><input
      type="text"
      name="power"
      class="form-control"
      placeholder="VD: 1.1 kW"
    />
  </div>
  <div class="col-md-6">
    <label>Bảo hành</label
    ><input
      type="text"
      name="warranty"
      class="form-control"
      placeholder="VD: 24 tháng"
    />
  </div>
</div>
