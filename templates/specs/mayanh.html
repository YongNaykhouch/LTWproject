<h5 class="text-warning mb-4">
  <i class="fas fa-camera me-2"></i>Thông Số Kỹ Thuật - Máy Ảnh
</h5>
<div class="row g-3">
  <div class="col-md-6">
    <label>Cảm biến / Độ phân giải</label
    ><input
      type="text"
      name="camera"
      class="form-control"
      placeholder="VD: APS-C 24.2MP"
    />
  </div>
  <div class="col-md-6">
    <label>Bộ xử lý</label
    ><input
      type="text"
      name="chip"
      class="form-control"
      placeholder="VD: DIGIC X"
    />
  </div>
  <div class="col-md-6">
    <label>Màn hình</label
    ><input
      type="text"
      name="display"
      class="form-control"
      placeholder="VD: 3 inch cảm ứng lật"
    />
  </div>
  <div class="col-md-6">
    <label>Bộ nhớ / Thẻ nhớ</label
    ><input
      type="text"
      name="storage"
      class="form-control"
      placeholder="VD: SD UHS-II 128GB"
    />
  </div>
  <div class="col-md-6">
    <label>Pin</label
    ><input
      type="text"
      name="battery"
      class="form-control"
      placeholder="VD: ~600 shots"
    />
  </div>
  <div class="col-md-6">
    <label>Bảo hành</label
    ><input
      type="text"
      name="warranty"
      class="form-control"
      placeholder="VD: 24 tháng"
    />
  </div>
</div>
