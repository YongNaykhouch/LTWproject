<h5 class="text-info mb-4">
  <i class="fas fa-headphones me-2"></i>Thông Số Kỹ Thuật - Tai Nghe
</h5>
<div class="row g-3">
  <div class="col-md-6">
    <label>Loại kết nối</label
    ><input
      type="text"
      name="wifi"
      class="form-control"
      placeholder="VD: Bluetooth 5.3 / Jack 3.5mm"
    />
  </div>
  <div class="col-md-6">
    <label>Thời lượng pin</label
    ><input
      type="text"
      name="battery"
      class="form-control"
      placeholder="VD: 30 giờ (có hộp)"
    />
  </div>
  <div class="col-md-6">
    <label>Driver / Chip âm thanh</label
    ><input
      type="text"
      name="chip"
      class="form-control"
      placeholder="VD: Driver 40mm / Chip A2DP"
    />
  </div>
  <div class="col-md-6">
    <label>Công nghệ</label
    ><input
      type="text"
      name="technology"
      class="form-control"
      placeholder="VD: Chống ồn ANC, LDAC"
    />
  </div>
  <div class="col-md-6">
    <label>Chống nước</label
    ><input
      type="text"
      name="water_resistance"
      class="form-control"
      placeholder="VD: IPX4"
    />
  </div>
  <div class="col-md-6">
    <label>Bảo hành</label
    ><input
      type="text"
      name="warranty"
      class="form-control"
      placeholder="VD: 12 tháng"
    />
  </div>
</div>
